<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BetaRyde — Transportation Reimagined</title>

    <!-- Google Fonts: Space Grotesk (headings) + General Sans (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!--
      General Sans is not on Google Fonts (it's a Fontshare font).
      Loaded from Fontshare CDN below; index.css also declares a
      system-font fallback stack under the same font-family name
      so the design never breaks if the CDN is blocked.
    -->
    <link
      href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#0B0511] text-white font-body antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
